<script src="db.js?v=3c94e53f"></script><script src="icons.js?v=761bbbf5"></script><script src="mobs.js?v=67c05163"></script><script>
const TIERS=['Tier 1','Tier 2','Tier 3','Tier 4'],RARITY_SCORE={Common:1,Uncommon:2,Rare:4,Legendary:7};
let activeTier='All',viewMode='Basic',selectedBldId=Object.keys(DB)[0]||'',activeTab='locations',selectedMobId=Object.keys(MOBS)[0]||'';
let tierSort='none',chanceSort='none';
let difficulty='Normal',lootLvl=0;
const ZOMBIE_FAMILY=["minecraft:zombie","minecraft:husk","minecraft:drowned"];
const DIFF_GROUP={"suburb_residential":"suburb","highrise_office":"office","highrise_residential":"office","highrise_hotel":"hotel","retail_district":"hotel","wasteland":"waste","abyss_district":"abyss"};
const FIN_MULT={"office":{"h":1.25,"d":1.25,"a":1},"hotel":{"h":1.5,"d":1.5,"a":1.25},"waste":{"h":2,"d":1.5,"a":1.5}};
const HARD_MULT={"suburb":{"h":1.25,"d":1.25,"a":1.25},"office":{"h":1.5,"d":1.25,"a":1.5},"hotel":{"h":1.75,"d":1.5,"a":1.75},"waste":{"h":2,"d":1.5,"a":2},"abyss":{"h":2,"d":1.5,"a":1.5}};
function districtGroup(d){return DIFF_GROUP[String(d||'')]||'';}
function effStats(m,district){
  const g=districtGroup(district);
  const s=m.stats||{hp:null,dmg:2,armor:0};
  const fin=(ZOMBIE_FAMILY.indexOf(String(m.id||'').split('@')[0])>=0&&FIN_MULT[g])?FIN_MULT[g]:{h:1,d:1,a:1};
  const hm=(difficulty==='Hard'&&HARD_MULT[g])?HARD_MULT[g]:{h:1,d:1,a:1};
  const r1=(v)=>v==null?null:(Math.round(v*10)/10);
  return {hp:s.hp==null?null:Math.round(s.hp*fin.h*hm.h),dmg:r1(s.dmg*fin.d*hm.d),armor:r1(s.armor*fin.a*hm.a)};
}
function statTxt(v){return v==null?'?':String(v);}
function confTip(m,k){try{const c=(m.statsConf||{})[k]||'';if(c==='kubejs')return 'KubeJS (точно)';if(c==='class')return 'байткод класса';if(c==='vanilla')return 'ванильные статы';if(c==='default')return 'дефолт — не измерено';if(c==='unknown')return 'неизвестно';return c||'?';}catch(e){return '?';}}
function statShown(m,k){const c=((m.statsConf||{})[k]||'');const v=(m.stats||{})[k];if(v==null)return null;if((k==='dmg'||k==='armor')&&(c==='default'||c==='unknown'||c===''))return null;return v;}
function armTxt(a){if(a==null)return '?';return a+' / '+(Math.round(a*10)/20)+' icons';}
function mobHeartSVG(){return '<svg class="mheart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#b8c26a" stroke="#4a4d33" stroke-width="1.5"/></svg>';}
function vestSVG(){return '<svg class="mvest" viewBox="0 0 24 24"><path d="M8 3h2.5v4.5c.8.5 1.7.5 2.5 0V3H16l1.5 3v15h-11V6L8 3z" fill="#6b7245" stroke="#3a3d22" stroke-width="1.4"/><path d="M9 12l2 2 1-3 2 3 1.5-2M10 17l1.5 1.5L13 17" stroke="#2c2e18" stroke-width="1" fill="none"/></svg>';}
function hpBarPct(m){const t=heroTriple(m);const hp=t.hp||0;return Math.max(hp>0?4:0,Math.min(100,Math.round(hp/1000*100)))+'%';}
function heroTriple(m){
  let best=null;
  for(const loc of m.locations||[]){const es=effStats(m,loc.district||'');if(es.hp!=null&&(best==null||es.hp>best.hp))best=es;}
  if(best!=null)return best;
  const s=m.stats||{hp:null,dmg:2,armor:0};return {hp:s.hp,dmg:s.dmg,armor:s.armor};
}
function tickNumber(el,from,to,dec){
  if(el==null||from==null||to==null){if(el!=null)el.textContent=(to==null?'?':String(to));return;}
  if(from===to){el.textContent=String(to);return;}
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=String(to);return;}
  const t0=performance.now(),dur=500;
  function fr(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3),v=from+(to-from)*e;
    el.textContent=dec?(Math.round(v*10)/10):Math.round(v);
    if(k<1)requestAnimationFrame(fr);}
  requestAnimationFrame(fr);
}
function swapDifficulty(v){
  if(v===difficulty)return;
  const m=MOBS[selectedMobId];
  const before=m?heroTriple(m):{hp:null,dmg:null,armor:null};
  const oldPct=m?hpBarPct(m):'0%';
  difficulty=v;renderMobView();
  if(!m)return;
  const after=heroTriple(m);
  const q=function(s){return viewEl.querySelector(s);};
  tickNumber(q('[data-herohp]'),before.hp,after.hp,0);
  tickNumber(q('[data-herodmg]'),before.dmg,after.dmg,1);
  tickNumber(q('[data-herarm]'),before.armor,after.armor,1);
  const fill=q('[data-hpbar]');
  if(fill){
    const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    fill.style.transition='none';fill.style.width=oldPct;void fill.offsetWidth;
    if(!reduce)fill.style.transition='';
    requestAnimationFrame(function(){fill.style.width=hpBarPct(m);});
  }
}
function refreshHeroNumbers(){
  const m=MOBS[selectedMobId];if(!m)return;
  const t=heroTriple(m);const q=function(s){return viewEl.querySelector(s);};
  const e1=q('[data-herohp]');if(e1)e1.textContent=t.hp==null?'?':String(t.hp);
  const e2=q('[data-herodmg]');if(e2)e2.textContent=statTxt(statShown(m,'dmg')==null?null:t.dmg);
  const e3=q('[data-herarm]');if(e3)e3.textContent=armTxt(statShown(m,'armor')==null?null:t.armor);
}

const searchEl=document.getElementById('search'),listEl=document.getElementById('bld-list'),viewEl=document.getElementById('bld-view'),suggestionsEl=document.getElementById('suggestions');
let sectionState={best:false,npc:false,installed:false};
let uiZoom=1.0;
const ZOOM_MIN=0.75, ZOOM_MAX=1.5, ZOOM_STEP=0.05;
const containerState=new Map();
function sectionToggle(key){sectionState[key]=!sectionState[key];renderView()}
function arrow(open){return open?'▼':'▶'}
function setZoom(value){uiZoom=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,Math.round(value*100)/100));const page=document.getElementById('page');page.style.zoom=uiZoom;page.style.width=(100/uiZoom)+'%';document.getElementById('zoomValue').textContent=Math.round(uiZoom*100)+'%';try{localStorage.setItem('dc_master_zoom',String(uiZoom))}catch(e){}}
function changeZoom(delta){setZoom(uiZoom+delta)}
function queryMatches(text,raw,q){
    const hay=clean(text);
    if(!q)return false;
    if(hay.includes(q))return true;
    const toks=String(raw||'').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
    if(!toks.length)return false;
    return toks.every(t=>hay.includes(clean(t)));
}
function itemMatches(it,raw,q){
    return queryMatches((it.item||'')+' '+(it.ammoId||'')+' '+(it.vid||'')+' '+(it.enchId||'')+' '+(it.display||''),raw,q);
}
function tradeMatches(t,raw,q){return queryMatches((t.item||'')+' '+(t.ammoId||'')+' '+(t.vid||'')+' '+(t.display||'')+' '+(t.currencyDisplay||''),raw,q)}
function searchIdentity(x){
    const id=String(x.vid||x.ammoId||x.id||'').toLowerCase();
    const variant=String(x.vid||x.ammoId||'').toLowerCase();
    return clean(variant || id.split(':').pop());
}
const SEARCH_TYPE_PRIORITY={'Vendor':7,'Installed Block':6,'Placed Block':5,'Machinery':4,'Loot':3,'Mob Drop':2,'Mob':1};
function buildSearchIndex(){
    const merged=new Map();
    const add=(x)=>{
        const key=searchIdentity(x);
        const prev=merged.get(key);
        if(!prev){ merged.set(key,{...x,types:new Set([x.type])}); return; }
        prev.types.add(x.type);
        if(!prev.icon && x.icon) prev.icon=x.icon;
        if((x.display||'').length>(prev.display||'').length) prev.display=x.display;
        if(!prev.building && x.building) prev.building=x.building;
        if(!prev.npc && x.npc) prev.npc=x.npc;
    };
    for(const b of Object.values(DB)){
        for(const c of b.containers||[]) for(const it of c.items||[]) add({id:it.vid||it.ammoId||it.item,display:it.display||pretty(it.item),type:'Loot',building:b.name,icon:iconForRecord(it),container:c.name,ammoId:it.ammoId||'',vid:it.vid||'',enchId:it.enchId||''});
        for(const n of b.npcs||[]) for(const t of n.trades||[]) add({id:t.vid||t.ammoId||t.item,display:t.display||pretty(t.item),type:'Vendor',building:b.name,npc:n.name,icon:iconForRecord(t),ammoId:t.ammoId||'',vid:t.vid||'',currency:t.currencyDisplay||''});
        for(const m of b.machinery||[]) add({id:m.name,display:m.display||pretty(m.name),type:'Machinery',building:b.name,icon:icon(m.name)});
        for(const ib of b.installedBlocks||[]) add({id:ib.block,display:ib.display||pretty(ib.block),type:'Installed Block',building:b.name,icon:icon(ib.block),floor:ib.floor});
        for(const ab of b.allPlacedBlocks||[]) add({id:ab.block,display:ab.display||pretty(ab.block),type:'Placed Block',building:b.name,icon:icon(ab.block),floor:ab.floor});
    }
    for(const m of Object.values(MOBS||{})){
        add({id:m.id,display:m.name||pretty(m.id),type:'Mob',building:(m.locations&&m.locations[0]?m.locations[0].name:''),icon:m.icon});
        for(const d of m.drops||[]) for(const loc of m.locations||[]) add({id:d.vid||d.ammoId||d.item,display:d.display||pretty(d.item),type:'Mob Drop',building:loc.name,mob:m.name,icon:iconForRecord(d),locationId:loc.id,ammoId:d.ammoId||'',vid:d.vid||''});
    }
    return Array.from(merged.values()).map(x=>{x.type=x.types?[...x.types].sort((a,b)=>(SEARCH_TYPE_PRIORITY[b]||0)-(SEARCH_TYPE_PRIORITY[a]||0)).join(' / '):x.type;delete x.types;return x;}).sort((a,b)=>clean(a.display).localeCompare(clean(b.display))||clean(a.building).localeCompare(clean(b.building)));
}

let SEARCH_INDEX=null;
function getSearchIndex(){if(!SEARCH_INDEX)SEARCH_INDEX=buildSearchIndex();return SEARCH_INDEX}
function showSuggestions(raw){
    const q=clean(raw);
    if(!q){suggestionsEl.classList.remove('open');suggestionsEl.innerHTML='';return}
    const tokens=String(raw||'').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean).map(clean);
    const ranked=[];
    for(const x of getSearchIndex()){
        const hay=clean(x.display)+' '+clean(x.id);
        let score=0,all=true;
        for(const tok of tokens){
            if(hay.includes(tok)){
                score+=tok.length*5;
                if(clean(x.display).startsWith(tok))score+=14;
            }else all=false;
        }
        if(all)score+=70;
        if(clean(x.id).startsWith(q))score+=20;
        if(score>0)ranked.push({...x,score});
    }
    ranked.sort((a,b)=>b.score-a.score||a.display.localeCompare(b.display));
    const top=[]; const seen=new Set();
    for(const x of ranked){
        const key=searchIdentity(x);
        if(seen.has(key))continue; seen.add(key); top.push(x); if(top.length>=10)break;
    }
    suggestionsEl.innerHTML=top.map(x=>
        '<div class="suggestion" data-suggest="'+html(x.id)+'">'+
        '<span>'+(x.icon?'<img class="suggestion-icon" src="'+x.icon+'">':'<span class="suggestion-icon"></span>')+'</span>'+
        '<span><div class="s-main">'+html(x.display)+'</div><div class="s-meta">'+html(x.type)+(x.npc?' • '+html(x.npc):'')+' • '+html(x.building)+'</div></span>'+
        '</div>'
    ).join('');
    suggestionsEl.classList.toggle('open',top.length>0);
}
suggestionsEl.addEventListener('mousedown',e=>{const el=e.target.closest('[data-suggest]');if(!el)return;searchEl.value=el.dataset.suggest; suggestionsEl.classList.remove('open');renderList()});
function clean(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function html(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function pretty(id){return String(id||'').split(':').pop().replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function icon(id){let x=ICONS[id];return typeof x==='string'?x:(x&&typeof x==='object'&&typeof x.data==='string'?x.data:'')}
function iconForRecord(r){return icon(r&&r.iconKey?r.iconKey:(r&&r.item?r.item:''))}
function tierLabel(t){if(t==='Tier 4')return'☢️ Tier 4';if(t==='Tier 3')return'🔥 Tier 3';if(t==='Tier 2')return'🏙️ Tier 2';return'🌿 Tier 1'}
function radiationClass(r){const s=String(r||'').toLowerCase();if(s.includes('extreme'))return'rad-extreme';if(s.includes('moderate'))return'rad-moderate';return'rad-none'}
function radiationLabel(r){const s=String(r||'').toLowerCase();if(s.includes('extreme'))return'☢️ '+String(r);if(s.includes('moderate'))return'☣️ '+String(r);return'◌ None'}
function getClimateClass(c){const s=String(c||'').toLowerCase();if(s.includes('cold'))return'clim-cold';if(s.includes('extreme')||s.includes('hot'))return'clim-hot';if(s.includes('warm'))return'clim-warm';return'clim-mod'}
function setTier(t){activeTier=t;['All','Tier 1','Tier 2','Tier 3','Tier 4'].forEach(x=>document.getElementById('tier-'+(x==='All'?'All':x.split(' ')[1])).classList.toggle('active',x===t));renderList()}
function setMode(m){viewMode='Basic';renderList()}
function locationChanceValue(b,m){
    if(m&&Number.isFinite(Number(m.max))&&Number(m.max)>=0)return Number(m.max);
    let best=0;
    for(const n of b.npcs||[]) for(const t of n.trades||[]) best=Math.max(best,100);
    for(const ib of b.installedBlocks||[]) best=Math.max(best,100);
    for(const c of b.containers||[]) for(const it of c.items||[]) best=Math.max(best,Number(it.chance)||0);
    return best;
}

function matchInfo(b,q,rawQ){
    const r={ok:false,max:-1};
    if(!q){r.ok=true;return r}
    if(queryMatches(b.name,rawQ,q)||queryMatches(b.id,rawQ,q)||queryMatches(b.category,rawQ,q))r.ok=true;
    for(const m of b.machinery||[]){
        if(queryMatches(m.name,rawQ,q)||queryMatches(m.display||'',rawQ,q)){
            r.ok=true;r.max=Math.max(r.max,parseFloat(String(m.chance).replace('%',''))||100);
        }
    }
    for(const ib of b.installedBlocks||[]){
        if(queryMatches(ib.block,rawQ,q)||queryMatches(ib.display||'',rawQ,q)||queryMatches(ib.floor,rawQ,q)) r.ok=true;
    }
    for(const ab of b.allPlacedBlocks||[]){
        if(queryMatches(ab.block,rawQ,q)||queryMatches(ab.display||'',rawQ,q)||queryMatches(ab.floor,rawQ,q)){r.ok=true;r.max=Math.max(r.max,Number(ab.count)||0);}
    }
    for(const n of b.npcs||[]){
        if(queryMatches(n.name,rawQ,q)||queryMatches(n.role,rawQ,q))r.ok=true;
        for(const t of n.trades||[]){
            if(queryMatches(t.item,rawQ,q)||queryMatches(t.ammoId||'',rawQ,q)||queryMatches(t.vid||'',rawQ,q)||queryMatches(t.display||'',rawQ,q)){
                r.ok=true;r.max=Math.max(r.max,100);
            }
        }
    }
    for(const m of Object.values(MOBS||{})){
        const mobHit=queryMatches(m.name,rawQ,q)||queryMatches(m.id,rawQ,q)||m.drops.some(d=>queryMatches(d.display||d.item,rawQ,q)||queryMatches(d.vid||'',rawQ,q));
        if(mobHit && (m.locations||[]).some(loc=>loc.id===b.id)){r.ok=true;r.max=Math.max(r.max,80);}
    }
    for(const c of b.containers||[]){
        if(queryMatches(c.name,rawQ,q))r.ok=true;
        for(const it of c.items||[]){
            const ik=it.searchKey||clean(it.item),ck=it.containerKey||clean(it.container);
            if(queryMatches(it.item,rawQ,q)||queryMatches(it.ammoId||'',rawQ,q)||queryMatches(it.vid||'',rawQ,q)||queryMatches(it.enchId||'',rawQ,q)||queryMatches(it.display||'',rawQ,q)||queryMatches(it.container,rawQ,q)){
                r.ok=true;
                if(queryMatches(it.item,rawQ,q)||queryMatches(it.ammoId||'',rawQ,q)||queryMatches(it.vid||'',rawQ,q)||queryMatches(it.enchId||'',rawQ,q)||queryMatches(it.display||'',rawQ,q))r.max=Math.max(r.max,Number(it.chance)||0);
            }
        }
    }
    return r;
}

function highlight(text,raw){let out=html(String(text||''));const toks=String(raw||'').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);for(const tok of toks){if(!tok)continue;const re=new RegExp('('+tok.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');out=out.replace(re,'<mark>$1</mark>')}return out}

function bestLocations(q){
    if(!q)return[];
    const raw=searchEl.value;
    const byLocation=new Map();
    const put=(b,best,priority)=>{
        if(!b)return;
        const current=byLocation.get(b.id);
        if(!current||priority>current.priority||(priority===current.priority&&Number(best.chance||0)>Number(current.best.chance||0))) byLocation.set(b.id,{b,best,priority});
    };
    for(const b of Object.values(DB)){
        for(const n of b.npcs||[]){
            for(const t of n.trades||[]){
                if(tradeMatches(t,raw,q)) put(b,{source:'Vendor',isNpc:true,isMachinery:false,npcName:n.name,npcAvatar:n.avatar||'',chance:100,displayChance:tradeCostText(t)+' • '+(t.count||1)+'x '+(t.display||pretty(t.item)),label:t.display||pretty(t.item),sub:'Buy from '+n.name+' • '+b.name,itemId:t.item},4);
            }
        }
        for(const c of b.containers||[]){
            for(const it of c.items||[]){
                if(itemMatches(it,raw,q)){
                    const ch=Number(it.chance)||0;
                    const occ=(it.variantChances||[]).find(v=>Number(v.chance)===Number(ch))||(it.variantChances||[])[0];
                    const vtext=occ&&occ.variant!==null&&occ.variant!==undefined?' • Variant '+occ.variant:(it.variants&&it.variants.length?' • Variants '+it.variants.join(', '):'');
                    put(b,{source:'Loot',isNpc:false,isMachinery:false,chance:ch,displayChance:'Loot',label:it.display||pretty(it.item),sub:b.name+' • '+c.name+' • '+c.floor+vtext,itemId:it.item},3);
                }
            }
        }
        for(const ib of b.installedBlocks||[]){
            if(queryMatches(ib.block,raw,q)||queryMatches(ib.display||'',raw,q)||queryMatches(ib.floor,raw,q)){
                put(b,{source:'Installed Block',isNpc:false,isMachinery:true,chance:100,displayChance:'Installed',label:ib.display||pretty(ib.block),sub:b.name+' • '+ib.floor+' • x'+ib.count,itemId:ib.block},2);
            }
        }
        for(const ab of b.allPlacedBlocks||[]){
            if(queryMatches(ab.block,raw,q)||queryMatches(ab.display||'',raw,q)||queryMatches(ab.floor,raw,q)){
                put(b,{source:'Placed Block',isNpc:false,isMachinery:false,chance:100,displayChance:'Placed',label:ab.display||pretty(ab.block),sub:b.name+' • '+ab.floor+' • x'+ab.count,itemId:ab.block},1);
            }
        }
    }
    for(const m of Object.values(MOBS||{})){
        const drop=(m.drops||[]).find(d=>queryMatches(d.display||d.item,raw,q));
        const mobHit=queryMatches(m.name,raw,q)||queryMatches(m.id,raw,q);
        if(!drop&&!mobHit)continue;
        for(const loc of m.locations||[]){
            const b=DB[loc.id];
            if(!b)continue;
            if(drop) put(b,{source:'Mob Drop',isNpc:false,isMachinery:false,chance:100,displayChance:'Mob Drop',label:drop.display||pretty(drop.item),sub:m.name+' • '+b.name,itemId:drop.item},1);
            else put(b,{source:'Mob Drop',isNpc:false,isMachinery:false,chance:100,displayChance:'Mob',label:m.name,sub:'Configured spawn • '+b.name,itemId:m.id},1);
        }
    }
    return [...byLocation.values()].sort((a,b)=>b.priority-a.priority||Number(b.best.chance||0)-Number(a.best.chance||0)||a.b.name.localeCompare(b.b.name));
}

        if(tierSort!=='none'){
            const ta=TIERS.indexOf(a.b.tier),tb=TIERS.indexOf(b.b.tier);
            const td=tierSort==='desc'?(tb-ta):(ta-tb);
            if(td!==0)return td;
        }
        if(chanceSort!=='none'){
            const ca=locationChanceValue(a.b,a.m),cb=locationChanceValue(b.b,b.m);
            const cd=chanceSort==='asc'?(ca-cb):(cb-ca);
            if(cd!==0)return cd;
        }
        if(q&&a.m.max!==b.m.max)return b.m.max-a.m.max;
        const ta=TIERS.indexOf(a.b.tier),tb=TIERS.indexOf(b.b.tier);
        return ta-tb||a.b.name.localeCompare(b.b.name);
    });
    let out='',last='';
    for(const r of rows){
        const tClass='t'+(r.b.tier.split(' ')[1]||'1');

        out+='<div class="card '+(r.id===selectedBldId?'active ':'')+'" data-bld="'+html(r.id)+'"><div class="title">'+catIconHtml(r.b.category)+html(r.b.name)+'</div><div class="meta"><span class="meta-tier '+tClass+'">'+html(tierLabel(r.b.tier))+'</span> | <span>'+html(r.b.district||r.b.category)+'</span> '+(npcIcons?'<span class="location-npc-icons">'+npcIcons+'</span>':'')+'</div></div>';

    const ids=Object.keys(DB),items=new Set();

function renderMobList(){
    const raw=searchEl.value.trim(),q=clean(raw);
    const rows=Object.values(MOBS).filter(m=>{
        if(mobTierFilter!=='All'&&(m.tier||'')!==mobTierFilter)return false;if(!q)return true;
        return queryMatches(m.name,raw,q)||queryMatches(m.id,raw,q)||m.locations.some(x=>queryMatches(x.name,raw,q))||m.drops.some(x=>queryMatches(x.display||x.item,raw,q));
    }).sort(mobListSort);
    let out='';
    for(const m of rows){
        out+='<div class="card '+(m.id===selectedMobId?'active ':'')+'" data-mob-id="'+html(m.id)+'"><div class="title">'+html(m.name)+'</div><div class="meta">'+(m.tier?html(m.tier)+' | ':'')+html(m.locations.length+' locations')+' | '+html(m.drops.length+' drops')+'</div></div>';
    }
    listEl.innerHTML=mobFilterRow()+(out||'<div class="notice">No mobs found.</div>');
    updateListScrollCue();
    if(rows.length&&!rows.some(r=>r.id===selectedMobId))selectedMobId=rows[0].id;
    renderMobView();
}

    h+='<div class="section">Drops</div><div class="mob-drop-grid">';

}

      b.name+' ('+b.tier+(b.district?' | '+b.district:'')+' | '+b.category+')',
      'Climate: '+b.climate+' | Radiation: '+b.radiation+' | Data: '+(b.dataConfidence||'Estimated'),
      b.npcs.length?'Vendors: '+b.npcs.map(n=>n.name+' ('+n.role+')').join(', '):'',
      (b.installedBlocks&&b.installedBlocks.length)?'Installed blocks: '+b.installedBlocks.map(m=>(m.display||pretty(m.block))+' x'+m.count+' ['+m.floor+']').join(', '):(b.machinery.length?'Machinery: '+b.machinery.map(m=>(m.display||pretty(m.name))+' x'+m.count).join(', '):''),
